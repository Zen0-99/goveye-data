name: Update Lords Votes

on:
  schedule:
    - cron: '0 */6 * * *'  # 4x daily (every 6 hours per D-09)
  workflow_dispatch:      # Manual trigger for seed builds and testing

permissions:
  contents: write  # Required by softprops/action-gh-release@v3
  actions: write   # Required to trigger update-debates workflow

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Lords divisions with detail fetches

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if parliament is in recess
        id: recess_check
        run: python check_recess.py

      - name: Restore seed checkpoint
        id: restore_checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: lords_votes.db
          key: lords-votes-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}
          restore-keys: |
            lords-votes-seed-${{ hashFiles('schemas/bundled_schema.json') }}-

      - name: Download previous DB and manifest
        id: download_prev
        run: |
          gh release download lords-votes-latest \
            --pattern lords_votes.db --output prev_lords_votes.db || echo "No previous DB (first run)"
          gh release download lords-votes-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
          if [ -f prev_lords_votes.db ]; then
            echo "has_previous=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download failed-run checkpoint (if any)
        if: steps.download_prev.outputs.has_previous != 'true'
        continue-on-error: true
        run: |
          PREV_RUN=$(gh run list --workflow=update-lords-votes.yml --status=failure --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" --name lords_votes-db-checkpoint --dir . || echo "No checkpoint from failed run"
            if [ -f lords_votes.db ]; then
              echo "Found checkpoint from failed run $PREV_RUN — will resume"
            fi
          fi
        env:
          GH_TOKEN: ${ "{" }secrets.GITHUB_TOKEN{ "}" }
      - name: Build Lords Votes database (seed mode)
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python build_lords_votes.py --output lords_votes.db --schema schemas/bundled_schema.json --mode seed --checkpoint-db lords_votes.db

      - name: Build Lords Votes database (delta mode)
        if: steps.download_prev.outputs.has_previous == 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python build_lords_votes.py --output lords_votes.db --schema schemas/bundled_schema.json --mode delta --previous-db prev_lords_votes.db

      - name: Save seed checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true' && always()
        uses: actions/cache@v4
        with:
          path: lords_votes.db
          key: lords-votes-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}

      - name: Upload checkpoint artifact (for failed-run resume)
        if: steps.download_prev.outputs.has_previous != 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: lords_votes-db-checkpoint
          path: lords_votes.db
          retention-days: 7

      - name: Generate diff patch
        if: steps.download_prev.outputs.has_previous == 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python diff_db.py --new lords_votes.db --previous prev_lords_votes.db --schema schemas/bundled_schema.json --output patch.json --tables divisions,division_votes

      - name: Generate diff patch (first run)
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python diff_db.py --new lords_votes.db --schema schemas/bundled_schema.json --output patch.json --tables divisions,division_votes

      - name: Generate manifest
        if: steps.download_prev.outputs.has_previous == 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python manifest.py --db lords_votes.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python manifest.py --db lords_votes.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        if: steps.recess_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: lords-votes-latest
          name: Lords Votes Latest
          body: |
            Lords Votes database update for GovEye (4x daily per D-09).

            - **lords_votes.db**: Per-API SQLite database (Lords divisions + division_votes, house=2 only)
            - **patch.json**: Incremental diff patch (divisions + division_votes)
            - **manifest.json**: Version, SHA-256 hashes, and file sizes
          files: |
            lords_votes.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger debates workflow
        if: steps.recess_check.outputs.skip != 'true'
        run: gh workflow run update-debates.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

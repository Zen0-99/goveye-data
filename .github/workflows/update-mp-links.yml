name: Update MP Links

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly, Monday 9am UTC (after expenses)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync schema from GovEye
        run: python sync_schema.py

      - name: Download mps.db (needed for MP name matching)
        run: |
          gh release download mps-latest --pattern mps.db --output mps.db || echo "No mps.db found"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore seed checkpoint
        id: restore_checkpoint
        if: steps.download_prev.outputs.has_previous != 'true'
        uses: actions/cache@v4
        with:
          path: mp_links.db
          key: mp-links-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}
          restore-keys: |
            mp-links-seed-${{ hashFiles('schemas/bundled_schema.json') }}-

      - name: Download previous DB and manifest
        id: download_prev
        run: |
          gh release download mp-links-latest \
            --pattern mp_links.db --output prev_mp_links.db || echo "No previous DB (first run)"
          gh release download mp-links-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
          if [ -f prev_mp_links.db ]; then
            echo "has_previous=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MP Links database (seed mode)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python build_parlparse.py --output mp_links.db --schema schemas/bundled_schema.json --mode seed --mps-db mps.db --checkpoint-db mp_links.db

      - name: Build MP Links database (delta mode)
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python build_parlparse.py --output mp_links.db --schema schemas/bundled_schema.json --mode delta --previous-db prev_mp_links.db --mps-db mps.db

      - name: Save seed checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && always()
        uses: actions/cache@v4
        with:
          path: mp_links.db
          key: mp-links-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}

      - name: Generate diff patch
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python diff_db.py --new mp_links.db --previous prev_mp_links.db --schema schemas/bundled_schema.json --output patch.json --tables mp_links

      - name: Generate diff patch (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python diff_db.py --new mp_links.db --schema schemas/bundled_schema.json --output patch.json --tables mp_links

      - name: Generate manifest
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python manifest.py --db mp_links.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python manifest.py --db mp_links.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mp-links-latest
          name: MP Links Latest
          body: |
            ParlParse social links update for GovEye (weekly).

            - **mp_links.db**: Per-API SQLite database (mp_links table only)
            - **patch.json**: Incremental diff patch (mp_links)
            - **manifest.json**: Version, SHA-256 hashes, and file sizes
          files: |
            mp_links.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

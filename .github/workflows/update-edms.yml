name: Update Early Day Motions

on:
  schedule:
    - cron: '0 6 * * *'  # Daily, 6am UTC — EMs are tabled on sitting days; clear of member-details/votes nightly runs
  workflow_dispatch:
    inputs:
      resweep:
        description: 'Refetch sponsor details for ALL EDMs (bounds the sponsor-withdrawal blind spot — Status/StatusDate/SponsorsCount do not move on signature withdrawal). ~4k detail calls, seed-like runtime.'
        type: boolean
        default: false

permissions:
  contents: write  # Required by softprops/action-gh-release@v3
  actions: write   # Required to dispatch build-seed.yml after first publish

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Seed ~= 4k detail calls at API_DELAY (~15 min) + list pages; delta ~= list + a handful of details

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync schema from GovEye
        run: python sync_schema.py

      - name: Restore seed checkpoint
        id: restore_checkpoint
        if: steps.download_prev.outputs.has_previous != 'true'
        uses: actions/cache@v4
        with:
          path: edms.db
          key: edms-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}
          restore-keys: |
            edms-seed-${{ hashFiles('schemas/bundled_schema.json') }}-

      - name: Download previous DB and manifest
        id: download_prev
        run: |
          gh release download edms-latest \
            --pattern edms.db --output prev_edms.db || echo "No previous DB (first run)"
          gh release download edms-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
          if [ -f prev_edms.db ]; then
            echo "has_previous=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download failed-run checkpoint (if any)
        if: steps.download_prev.outputs.has_previous != 'true'
        continue-on-error: true
        run: |
          PREV_RUN=$(gh run list --workflow=update-edms.yml --status=failure --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" --name edms-db-checkpoint --dir . || echo "No checkpoint from failed run"
            if [ -f edms.db ]; then
              echo "Found checkpoint from failed run $PREV_RUN — will resume"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Early Day Motions database (seed mode)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python build_edms.py --output edms.db \
            --schema schemas/bundled_schema.json --mode seed \
            --checkpoint-db edms.db

      - name: Build Early Day Motions database (delta mode)
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python build_edms.py --output edms.db \
            --schema schemas/bundled_schema.json --mode delta \
            --previous-db prev_edms.db ${{ github.event.inputs.resweep == 'true' && '--resweep-details' || '' }}

      - name: Save seed checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && always()
        uses: actions/cache@v4
        with:
          path: edms.db
          key: edms-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}

      - name: Upload checkpoint artifact (for failed-run resume)
        if: steps.download_prev.outputs.has_previous != 'true' && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: edms-db-checkpoint
          path: edms.db
          retention-days: 7

      - name: Generate diff patch
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python diff_db.py --new edms.db --previous prev_edms.db \
            --schema schemas/bundled_schema.json --output patch.json \
            --tables early_day_motions,edm_sponsors

      - name: Generate diff patch (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python diff_db.py --new edms.db --schema schemas/bundled_schema.json \
            --output patch.json --tables early_day_motions,edm_sponsors

      - name: Generate manifest
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python manifest.py --db edms.db --patch patch.json --output manifest.json \
            --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python manifest.py --db edms.db --patch patch.json --output manifest.json \
            --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: edms-latest
          name: Early Day Motions Latest
          body: |
            Early Day Motions for GovEye (daily).

            - **edms.db**: Per-API SQLite database
              (early_day_motions + edm_sponsors tables)
            - **patch.json**: Incremental diff patch
            - **manifest.json**: Version, SHA-256 hashes, and file sizes

            See manifest.json for the current version number and file hashes.
          files: |
            edms.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger seed rebuild after first publish
        # First edms-latest publish only: installs between this publish and
        # the next seed rebuild would get edmsVersion=1 with empty EDM
        # tables, and the untracked-stream bootstrap never fires for them
        # (window <=6h but deterministic). A manual dispatch closes it.
        if: steps.download_prev.outputs.has_previous != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-seed.yml

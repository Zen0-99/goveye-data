name: Update Debates

on:
  workflow_dispatch:      # Manual trigger, or triggered by votes workflows
  # No schedule — debates is triggered by update-commons-votes and update-lords-votes
  # after they complete. This guarantees the votes DBs have fresh twfyDebateUrl data.

# Concurrency: if both votes workflows trigger debates at nearly the same time,
# queue them rather than cancelling — the second run will see the first run's
# published DB and run in delta mode with fewer new debates to process.
concurrency:
  group: debates-update
  cancel-in-progress: false

permissions:
  contents: write  # Required by softprops/action-gh-release@v3

# Seed mode is split into a chain of batch jobs (seed-batch-1 … seed-batch-6)
# because a single 60-minute job gets killed by the GitHub Actions timeout before
# the checkpoint can be saved. Each batch processes at most 500 debates, saves
# the checkpoint DB as a workflow artifact, and exits with code 2 to signal that
# more work remains. The next batch downloads the artifact and resumes.
#
# Delta mode (incremental update) runs in a single job inside publish — it only
# fetches a handful of new debates and completes well within the timeout.
#
# To increase total seed capacity, add more seed-batch-N jobs following the
# same pattern and add them to the publish job's needs list.

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dependency DBs (commons-votes, lords-votes, mps, historical-members)
        run: |
          # Download the latest commons-votes.db, lords-votes.db, mps.db, and historical_members.db
          # from their respective releases. These are needed to:
          # - commons-votes.db / lords-votes.db: read twfyDebateUrl column
          # - mps.db: name matching (speaker name -> Parliament member ID)
          # - historical_members.db: TWFY person ID -> Parliament member ID matching
          gh release download commons-votes-latest --pattern commons_votes.db --output commons_votes.db || echo "No commons-votes DB yet"
          gh release download lords-votes-latest --pattern lords_votes.db --output lords_votes.db || echo "No lords-votes DB yet"
          gh release download mps-latest --pattern mps.db --output mps.db || echo "No mps DB yet"
          gh release download historical-members-latest --pattern historical_members.db --output historical_members.db || echo "No historical-members DB yet"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify votes DBs have twfyDebateUrl
        run: |
          python -c "
          import sqlite3, sys
          for db, name in [('commons_votes.db', 'Commons'), ('lords_votes.db', 'Lords')]:
              try:
                  conn = sqlite3.connect(db)
                  cols = [r[1] for r in conn.execute('PRAGMA table_info(divisions)').fetchall()]
                  if 'twfyDebateUrl' not in cols:
                      print(f'::warning::{name} votes DB missing twfyDebateUrl column — debates will find 0 debates from {name}')
                  else:
                      count = conn.execute('SELECT COUNT(*) FROM divisions WHERE twfyDebateUrl IS NOT NULL').fetchone()[0]
                      print(f'{name}: {count} divisions with twfyDebateUrl')
                  conn.close()
              except Exception as e:
                  print(f'::warning::Could not check {name} votes DB: {e}')
          "

      - name: Download previous debates DB and manifest
        id: download_prev
        run: |
          gh release download debates-latest \
            --pattern debates.db --output prev_debates.db || echo "No previous DB (first run)"
          gh release download debates-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build mode
        id: mode
        run: |
          if [ -f prev_debates.db ]; then
            echo "mode=delta" >> $GITHUB_OUTPUT
          else
            echo "mode=seed" >> $GITHUB_OUTPUT
          fi

      - name: Upload dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-dbs
          path: |
            commons_votes.db
            lords_votes.db
            mps.db
            historical_members.db
            prev_debates.db
            prev_manifest.json
          if-no-files-found: ignore
          retention-days: 1

  # --- Seed chain: each batch processes 500 debates then passes the checkpoint ---

  seed-batch-1:
    needs: prepare
    if: needs.prepare.outputs.mode == 'seed'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      more_work: ${{ steps.build.outputs.more_work }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dependency DBs
        uses: actions/download-artifact@v4
        with:
          name: dependency-dbs

      - name: Build seed batch 1
        id: build
        run: |
          set +e
          python build_debates.py \
            --output debates.db \
            --schema schemas/bundled_schema.json \
            --mode seed \
            --commons-db commons_votes.db \
            --lords-db lords_votes.db \
            --mps-db mps.db \
            --historical-members-db historical_members.db \
            --checkpoint-db debates.db \
            --max-debates 500
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "more_work=true" >> $GITHUB_OUTPUT
          elif [ $code -ne 0 ]; then
            exit $code
          else
            echo "more_work=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: debates-checkpoint-1
          path: debates.db
          retention-days: 1

  seed-batch-2:
    needs: seed-batch-1
    if: needs.seed-batch-1.outputs.more_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      more_work: ${{ steps.build.outputs.more_work }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dependency DBs
        uses: actions/download-artifact@v4
        with:
          name: dependency-dbs

      - name: Download previous checkpoint
        uses: actions/download-artifact@v4
        with:
          name: debates-checkpoint-1

      - name: Build seed batch 2
        id: build
        run: |
          set +e
          python build_debates.py \
            --output debates.db \
            --schema schemas/bundled_schema.json \
            --mode seed \
            --commons-db commons_votes.db \
            --lords-db lords_votes.db \
            --mps-db mps.db \
            --historical-members-db historical_members.db \
            --checkpoint-db debates.db \
            --max-debates 500
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "more_work=true" >> $GITHUB_OUTPUT
          elif [ $code -ne 0 ]; then
            exit $code
          else
            echo "more_work=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: debates-checkpoint-2
          path: debates.db
          retention-days: 1

  seed-batch-3:
    needs: seed-batch-2
    if: needs.seed-batch-2.outputs.more_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      more_work: ${{ steps.build.outputs.more_work }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dependency DBs
        uses: actions/download-artifact@v4
        with:
          name: dependency-dbs

      - name: Download previous checkpoint
        uses: actions/download-artifact@v4
        with:
          name: debates-checkpoint-2

      - name: Build seed batch 3
        id: build
        run: |
          set +e
          python build_debates.py \
            --output debates.db \
            --schema schemas/bundled_schema.json \
            --mode seed \
            --commons-db commons_votes.db \
            --lords-db lords_votes.db \
            --mps-db mps.db \
            --historical-members-db historical_members.db \
            --checkpoint-db debates.db \
            --max-debates 500
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "more_work=true" >> $GITHUB_OUTPUT
          elif [ $code -ne 0 ]; then
            exit $code
          else
            echo "more_work=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: debates-checkpoint-3
          path: debates.db
          retention-days: 1

  seed-batch-4:
    needs: seed-batch-3
    if: needs.seed-batch-3.outputs.more_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      more_work: ${{ steps.build.outputs.more_work }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dependency DBs
        uses: actions/download-artifact@v4
        with:
          name: dependency-dbs

      - name: Download previous checkpoint
        uses: actions/download-artifact@v4
        with:
          name: debates-checkpoint-3

      - name: Build seed batch 4
        id: build
        run: |
          set +e
          python build_debates.py \
            --output debates.db \
            --schema schemas/bundled_schema.json \
            --mode seed \
            --commons-db commons_votes.db \
            --lords-db lords_votes.db \
            --mps-db mps.db \
            --historical-members-db historical_members.db \
            --checkpoint-db debates.db \
            --max-debates 500
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "more_work=true" >> $GITHUB_OUTPUT
          elif [ $code -ne 0 ]; then
            exit $code
          else
            echo "more_work=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: debates-checkpoint-4
          path: debates.db
          retention-days: 1

  seed-batch-5:
    needs: seed-batch-4
    if: needs.seed-batch-4.outputs.more_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      more_work: ${{ steps.build.outputs.more_work }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dependency DBs
        uses: actions/download-artifact@v4
        with:
          name: dependency-dbs

      - name: Download previous checkpoint
        uses: actions/download-artifact@v4
        with:
          name: debates-checkpoint-4

      - name: Build seed batch 5
        id: build
        run: |
          set +e
          python build_debates.py \
            --output debates.db \
            --schema schemas/bundled_schema.json \
            --mode seed \
            --commons-db commons_votes.db \
            --lords-db lords_votes.db \
            --mps-db mps.db \
            --historical-members-db historical_members.db \
            --checkpoint-db debates.db \
            --max-debates 500
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "more_work=true" >> $GITHUB_OUTPUT
          elif [ $code -ne 0 ]; then
            exit $code
          else
            echo "more_work=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: debates-checkpoint-5
          path: debates.db
          retention-days: 1

  seed-batch-6:
    needs: seed-batch-5
    if: needs.seed-batch-5.outputs.more_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      more_work: ${{ steps.build.outputs.more_work }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dependency DBs
        uses: actions/download-artifact@v4
        with:
          name: dependency-dbs

      - name: Download previous checkpoint
        uses: actions/download-artifact@v4
        with:
          name: debates-checkpoint-5

      - name: Build seed batch 6
        id: build
        run: |
          set +e
          python build_debates.py \
            --output debates.db \
            --schema schemas/bundled_schema.json \
            --mode seed \
            --commons-db commons_votes.db \
            --lords-db lords_votes.db \
            --mps-db mps.db \
            --historical-members-db historical_members.db \
            --checkpoint-db debates.db \
            --max-debates 500
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "more_work=true" >> $GITHUB_OUTPUT
          elif [ $code -ne 0 ]; then
            exit $code
          else
            echo "more_work=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: debates-checkpoint-6
          path: debates.db
          retention-days: 1

  publish:
    needs: [prepare, seed-batch-1, seed-batch-2, seed-batch-3, seed-batch-4, seed-batch-5, seed-batch-6]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- Delta mode: build incrementally in this job ---

      - name: Download dependency DBs
        if: needs.prepare.outputs.mode == 'delta'
        uses: actions/download-artifact@v4
        with:
          name: dependency-dbs

      - name: Build Debates database (delta mode)
        if: needs.prepare.outputs.mode == 'delta'
        run: |
          python build_debates.py \
            --output debates.db \
            --schema schemas/bundled_schema.json \
            --mode delta \
            --previous-db prev_debates.db \
            --commons-db commons_votes.db \
            --lords-db lords_votes.db \
            --mps-db mps.db \
            --historical-members-db historical_members.db

      # --- Seed mode: download the latest checkpoint from the chain ---

      - name: Download latest seed checkpoint
        if: needs.prepare.outputs.mode == 'seed'
        run: |
          # Try checkpoint artifacts in reverse order — the highest-numbered
          # one that exists is the final checkpoint from the chain.
          for i in 6 5 4 3 2 1; do
            rm -rf checkpoint
            if gh run download "$GITHUB_RUN_ID" \
                 --repo "${{ github.repository }}" \
                 --name "debates-checkpoint-$i" \
                 --dir checkpoint 2>/dev/null; then
              echo "Found checkpoint from batch $i"
              cp checkpoint/debates.db debates.db
              break
            fi
          done
          if [ ! -f debates.db ]; then
            echo "::error::No seed checkpoint found"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Generate diff + manifest, then publish ---

      - name: Generate diff patch
        if: needs.prepare.outputs.mode == 'delta'
        run: |
          python diff_db.py --new debates.db --previous prev_debates.db --schema schemas/bundled_schema.json --output patch.json --tables debate_speeches

      - name: Generate diff patch (first run)
        if: needs.prepare.outputs.mode == 'seed'
        run: |
          python diff_db.py --new debates.db --schema schemas/bundled_schema.json --output patch.json --tables debate_speeches

      - name: Generate manifest
        if: needs.prepare.outputs.mode == 'delta'
        run: |
          python manifest.py --db debates.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: needs.prepare.outputs.mode == 'seed'
        run: |
          python manifest.py --db debates.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: debates-latest
          fail_on_unmatched_files: true
          name: Debates Latest
          body: |
            Debate transcripts database update for GovEye (twice daily).

            - **debates.db**: Per-API SQLite database (debate_speeches table)
            - **patch.json**: Incremental diff patch (debate_speeches)
            - **manifest.json**: Version, SHA-256 hashes, and file sizes

            See manifest.json for the current version number and file hashes.
          files: |
            debates.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

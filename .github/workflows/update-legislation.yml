name: Update Legislation

on:
  schedule:
    - cron: '0 */6 * * *'  # 4x daily (every 6 hours)
  workflow_dispatch:      # Manual trigger for seed builds and testing

permissions:
  contents: write  # Required by softprops/action-gh-release@v3

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # legislation.gov.uk Atom feed is fast

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync schema from GovEye
        run: python sync_schema.py

      - name: Restore seed checkpoint
        id: restore_checkpoint
        if: steps.download_prev.outputs.has_previous != 'true'
        uses: actions/cache@v4
        with:
          path: legislation.db
          key: legislation-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}
          restore-keys: |
            legislation-seed-${{ hashFiles('schemas/bundled_schema.json') }}-

      - name: Download previous DB and manifest
        id: download_prev
        run: |
          gh release download legislation-latest \
            --pattern legislation.db --output prev_legislation.db || echo "No previous DB (first run)"
          gh release download legislation-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
          if [ -f prev_legislation.db ]; then
            echo "has_previous=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download failed-run checkpoint (if any)
        if: steps.download_prev.outputs.has_previous != 'true'
        continue-on-error: true
        run: |
          PREV_RUN=$(gh run list --workflow=update-legislation.yml --status=failure --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" --name legislation-db-checkpoint --dir . || echo "No checkpoint from failed run"
            if [ -f legislation.db ]; then
              echo "Found checkpoint from failed run $PREV_RUN — will resume"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Legislation database (seed mode)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python build_legislation.py --output legislation.db --schema schemas/bundled_schema.json --mode seed --checkpoint-db legislation.db

      - name: Build Legislation database (delta mode)
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python build_legislation.py --output legislation.db --schema schemas/bundled_schema.json --mode delta --previous-db prev_legislation.db

      - name: Save seed checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && always()
        uses: actions/cache@v4
        with:
          path: legislation.db
          key: legislation-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}

      - name: Upload checkpoint artifact (for failed-run resume)
        if: steps.download_prev.outputs.has_previous != 'true' && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: legislation-db-checkpoint
          path: legislation.db
          retention-days: 7

      # Per-API DBs are intermediate artifacts, not opened by Room.
      # Schema validation happens on the merged goveye.db in build-seed.yml.
      - name: Generate diff patch
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python diff_db.py --new legislation.db --previous prev_legislation.db --schema schemas/bundled_schema.json --output patch.json --tables legislation

      - name: Generate diff patch (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python diff_db.py --new legislation.db --schema schemas/bundled_schema.json --output patch.json --tables legislation

      - name: Generate manifest
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python manifest.py --db legislation.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python manifest.py --db legislation.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: legislation-latest
          name: Legislation Latest
          body: |
            Legislation database update for GovEye (4x daily).

            - **legislation.db**: Per-API SQLite database (legislation.gov.uk new legislation)
            - **patch.json**: Incremental diff patch (legislation)
            - **manifest.json**: Version, SHA-256 hashes, and file sizes
          files: |
            legislation.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

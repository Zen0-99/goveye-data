name: Update Votes

on:
  schedule:
    - cron: '0 */6 * * *'  # 4x daily (every 6 hours per D-09)
  workflow_dispatch:      # Manual trigger for seed builds and testing

permissions:
  contents: write  # Required by softprops/action-gh-release@v3

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Votes fetch can be slow — thousands of divisions with detail fetches

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download previous DB and manifest
        id: download_prev
        run: |
          # Attempt to download previous votes.db and manifest.json from the votes-latest release.
          # If this fails (first run, no previous release), we proceed in seed mode.
          gh release download votes-latest \
            --pattern votes.db --output prev_votes.db || echo "No previous DB (first run)"
          gh release download votes-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
          if [ -f prev_votes.db ]; then
            echo "has_previous=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Votes database (seed mode)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python build_votes.py --output votes.db --schema schemas/bundled_schema.json --mode seed

      - name: Build Votes database (delta mode)
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python build_votes.py --output votes.db --schema schemas/bundled_schema.json --mode delta --previous-db prev_votes.db

      # Per-API DBs are intermediate artifacts, not opened by Room.
      # Schema validation happens on the merged goveye.db in build-seed.yml.
      - name: Generate diff patch
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python diff_db.py --new votes.db --previous prev_votes.db --schema schemas/bundled_schema.json --output patch.json --tables divisions,division_votes

      - name: Generate diff patch (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python diff_db.py --new votes.db --schema schemas/bundled_schema.json --output patch.json --tables divisions,division_votes

      - name: Generate manifest
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python manifest.py --db votes.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python manifest.py --db votes.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag: votes-latest
          name: Votes Latest
          body: |
            Votes database update for GovEye (4x daily per D-09).

            - **votes.db**: Per-API SQLite database (divisions + division_votes tables only)
            - **patch.json**: Incremental diff patch (divisions + division_votes)
            - **manifest.json**: Version, SHA-256 hashes, and file sizes

            Commons divisions are fetched first and committed; Lords fetch
            failures do not block the publish (resilience design).
          files: |
            votes.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

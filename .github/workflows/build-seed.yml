name: Build Seed

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours — lightweight check, only merges if data changed
  workflow_dispatch:  # Manual trigger still available

permissions:
  contents: write  # Required by softprops/action-gh-release@v3

jobs:
  build-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Check phase is ~30s; merge phase is ~5-10 min

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- Phase 1: Check if any per-API DB changed ---

      - name: Download seed-manifest.json (if exists)
        id: download_seed_manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download seed-latest --pattern seed-manifest.json --output seed-manifest.json || echo "No seed-manifest.json (first run)"

      - name: Download all 16 per-API manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download mps-latest --pattern manifest.json --output mps_manifest.json || echo "WARN: mps manifest not found"
          gh release download commons-votes-latest --pattern manifest.json --output commons_manifest.json || echo "WARN: commons manifest not found"
          gh release download lords-votes-latest --pattern manifest.json --output lords_manifest.json || echo "WARN: lords manifest not found"
          gh release download bills-latest --pattern manifest.json --output bills_manifest.json || echo "WARN: bills manifest not found"
          gh release download committees-latest --pattern manifest.json --output committees_manifest.json || echo "WARN: committees manifest not found"
          gh release download recess-latest --pattern manifest.json --output recess_manifest.json || echo "WARN: recess manifest not found"
          gh release download interests-latest --pattern manifest.json --output interests_manifest.json || echo "WARN: interests manifest not found"
          gh release download party-stats-latest --pattern manifest.json --output party_stats_manifest.json || echo "WARN: party-stats manifest not found"
          gh release download bio-data-latest --pattern manifest.json --output bio_data_manifest.json || echo "WARN: bio-data manifest not found"
          gh release download expenses-latest --pattern manifest.json --output expenses_manifest.json || echo "WARN: expenses manifest not found"
          gh release download mp-links-latest --pattern manifest.json --output mp_links_manifest.json || echo "WARN: mp-links manifest not found"
          gh release download manifestos-latest --pattern manifest.json --output manifestos_manifest.json || echo "WARN: manifestos manifest not found"
          gh release download historical-members-latest --pattern manifest.json --output historical_members_manifest.json || echo "WARN: historical-members manifest not found"
          gh release download debates-latest --pattern manifest.json --output debates_manifest.json || echo "WARN: debates manifest not found"
          gh release download member-details-latest --pattern manifest.json --output member_details_manifest.json || echo "WARN: member-details manifest not found"
          gh release download hansard-latest --pattern manifest.json --output hansard_manifest.json || echo "WARN: hansard manifest not found"
          gh release download gov-publications-latest --pattern manifest.json --output gov_publications_manifest.json || echo "WARN: gov-publications manifest not found"
          gh release download written-statements-latest --pattern manifest.json --output written_statements_manifest.json || echo "WARN: written-statements manifest not found"
          gh release download legislation-latest --pattern manifest.json --output legislation_manifest.json || echo "WARN: legislation manifest not found"

      - name: Check if seed needs update
        id: check
        run: |
          python check_seed.py \
            --seed-manifest seed-manifest.json \
            --mps-manifest mps_manifest.json \
            --commons-votes-manifest commons_manifest.json \
            --lords-votes-manifest lords_manifest.json \
            --bills-manifest bills_manifest.json \
            --committees-manifest committees_manifest.json \
            --recess-manifest recess_manifest.json \
            --interests-manifest interests_manifest.json \
            --party-stats-manifest party_stats_manifest.json \
            --bio-data-manifest bio_data_manifest.json \
            --expenses-manifest expenses_manifest.json \
            --mp-links-manifest mp_links_manifest.json \
            --manifestos-manifest manifestos_manifest.json \
            --historical-members-manifest historical_members_manifest.json \
            --debates-manifest debates_manifest.json \
            --member-details-manifest member_details_manifest.json \
            --hansard-manifest hansard_manifest.json \
            --gov-publications-manifest gov_publications_manifest.json \
            --written-statements-manifest written_statements_manifest.json \
            --legislation-manifest legislation_manifest.json >> $GITHUB_OUTPUT

      # --- Phase 2: Merge (only if data changed) ---

      - name: Restore cached per-API DBs
        if: steps.check.outputs.needs_update == 'true'
        id: restore_cache
        uses: actions/cache@v4
        with:
          path: per-api-cache
          key: per-api-dbs-${{ hashFiles('mps_manifest.json', 'commons_manifest.json', 'lords_manifest.json', 'bills_manifest.json', 'committees_manifest.json', 'recess_manifest.json', 'interests_manifest.json', 'party_stats_manifest.json', 'bio_data_manifest.json', 'expenses_manifest.json', 'mp_links_manifest.json', 'manifestos_manifest.json', 'historical_members_manifest.json', 'debates_manifest.json', 'member_details_manifest.json', 'hansard_manifest.json', 'gov_publications_manifest.json', 'written_statements_manifest.json', 'legislation_manifest.json') }}
          restore-keys: |
            per-api-dbs-

      - name: Download changed per-API DBs
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_APIS: ${{ steps.check.outputs.changed_apis }}
        run: |
          mkdir -p per-api-cache
          # Download only the DBs that changed; restore others from cache
          IFS=',' read -ra APIS <<< "$CHANGED_APIS"
          for api in "${APIS[@]}"; do
            case $api in
              mps)
                echo "Downloading mps.db (changed)"
                gh release download mps-latest --pattern mps.db --output per-api-cache/mps.db --clobber
                ;;
              commons_votes)
                echo "Downloading commons_votes.db (changed)"
                gh release download commons-votes-latest --pattern commons_votes.db --output per-api-cache/commons_votes.db --clobber
                ;;
              lords_votes)
                echo "Downloading lords_votes.db (changed)"
                gh release download lords-votes-latest --pattern lords_votes.db --output per-api-cache/lords_votes.db --clobber
                ;;
              bills)
                echo "Downloading bills.db (changed)"
                gh release download bills-latest --pattern bills.db --output per-api-cache/bills.db --clobber
                ;;
              committees)
                echo "Downloading committees.db (changed)"
                gh release download committees-latest --pattern committees.db --output per-api-cache/committees.db --clobber
                ;;
              recess)
                echo "Downloading recess.db (changed)"
                gh release download recess-latest --pattern recess.db --output per-api-cache/recess.db --clobber
                ;;
              interests)
                echo "Downloading interests.db (changed)"
                gh release download interests-latest --pattern interests.db --output per-api-cache/interests.db --clobber
                ;;
              party_stats)
                echo "Downloading party_stats.db (changed)"
                gh release download party-stats-latest --pattern party_stats.db --output per-api-cache/party_stats.db --clobber
                ;;
              bio_data)
                echo "Downloading bio_data.db (changed)"
                gh release download bio-data-latest --pattern bio_data.db --output per-api-cache/bio_data.db --clobber
                ;;
              expenses)
                echo "Downloading expenses.db (changed)"
                gh release download expenses-latest --pattern expenses.db --output per-api-cache/expenses.db --clobber
                ;;
              mp_links)
                echo "Downloading mp_links.db (changed)"
                gh release download mp-links-latest --pattern mp_links.db --output per-api-cache/mp_links.db --clobber
                ;;
              manifestos)
                echo "Downloading manifestos.db (changed)"
                gh release download manifestos-latest --pattern manifestos.db --output per-api-cache/manifestos.db --clobber
                ;;
              historical_members)
                echo "Downloading historical_members.db (changed)"
                gh release download historical-members-latest --pattern historical_members.db --output per-api-cache/historical_members.db --clobber
                ;;
              debates)
                echo "Downloading debates.db (changed)"
                gh release download debates-latest --pattern debates.db --output per-api-cache/debates.db --clobber
                ;;
              member_details)
                echo "Downloading member_details.db (changed)"
                gh release download member-details-latest --pattern member_details.db --output per-api-cache/member_details.db --clobber
                ;;
              hansard)
                echo "Downloading hansard.db (changed)"
                gh release download hansard-latest --pattern hansard.db --output per-api-cache/hansard.db --clobber
                ;;
              gov_publications)
                echo "Downloading gov_publications.db (changed)"
                gh release download gov-publications-latest --pattern gov_publications.db --output per-api-cache/gov_publications.db --clobber
                ;;
              written_statements)
                echo "Downloading written_statements.db (changed)"
                gh release download written-statements-latest --pattern written_statements.db --output per-api-cache/written_statements.db --clobber
                ;;
              legislation)
                echo "Downloading legislation.db (changed)"
                gh release download legislation-latest --pattern legislation.db --output per-api-cache/legislation.db --clobber
                ;;
            esac
          done

          # Download any DBs still missing from cache (cache miss recovery)
          # Tolerates missing releases (e.g. new per-API workflows that haven't
          # succeeded yet) — the verify step will catch truly missing DBs.
          download_if_missing() {
            local db_name="$1"
            local release_tag="$2"
            if [ ! -f "per-api-cache/$db_name" ]; then
              echo "Downloading $db_name (not in cache)"
              gh release download "$release_tag" --pattern "$db_name" --output "per-api-cache/$db_name" --clobber 2>/dev/null || \
                echo "WARN: $db_name not found in release $release_tag — per-API workflow may not have succeeded yet"
            else
              echo "$db_name already in cache"
            fi
          }
          download_if_missing mps.db mps-latest
          download_if_missing commons_votes.db commons-votes-latest
          download_if_missing lords_votes.db lords-votes-latest
          download_if_missing bills.db bills-latest
          download_if_missing committees.db committees-latest
          download_if_missing recess.db recess-latest
          download_if_missing interests.db interests-latest
          download_if_missing party_stats.db party-stats-latest
          download_if_missing bio_data.db bio-data-latest
          download_if_missing expenses.db expenses-latest
          download_if_missing mp_links.db mp-links-latest
          download_if_missing manifestos.db manifestos-latest
          download_if_missing historical_members.db historical-members-latest
          download_if_missing debates.db debates-latest
          download_if_missing member_details.db member-details-latest
          download_if_missing hansard.db hansard-latest
          download_if_missing gov_publications.db gov-publications-latest
          download_if_missing written_statements.db written-statements-latest
          download_if_missing legislation.db legislation-latest

      - name: Verify all 19 DBs present
        if: steps.check.outputs.needs_update == 'true'
        run: |
          missing=0
          for db in mps.db commons_votes.db lords_votes.db bills.db committees.db recess.db interests.db party_stats.db bio_data.db expenses.db mp_links.db manifestos.db historical_members.db debates.db member_details.db hansard.db gov_publications.db written_statements.db legislation.db; do
            if [ ! -f "per-api-cache/$db" ]; then
              echo "ERROR: $db is missing — cannot build a complete seed"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more per-API DBs are missing. Ensure all per-API workflows have completed at least one successful run before building the seed."
            exit 1
          fi
          echo "All 19 per-API DBs present."

      - name: Merge per-API DBs into goveye.db
        if: steps.check.outputs.needs_update == 'true'
        run: |
          python merge_dbs.py --output goveye.db --schema schemas/bundled_schema.json \
            --mps-db per-api-cache/mps.db --commons-votes-db per-api-cache/commons_votes.db \
            --lords-votes-db per-api-cache/lords_votes.db --bills-db per-api-cache/bills.db \
            --committees-db per-api-cache/committees.db --recess-db per-api-cache/recess.db \
            --interests-db per-api-cache/interests.db --party-stats-db per-api-cache/party_stats.db \
            --bio-data-db per-api-cache/bio_data.db --expenses-db per-api-cache/expenses.db \
            --mp-links-db per-api-cache/mp_links.db --manifestos-db per-api-cache/manifestos.db \
            --historical-members-db per-api-cache/historical_members.db --debates-db per-api-cache/debates.db \
            --member-details-db per-api-cache/member_details.db \
            --hansard-db per-api-cache/hansard.db \
            --gov-publications-db per-api-cache/gov_publications.db \
            --written-statements-db per-api-cache/written_statements.db \
            --legislation-db per-api-cache/legislation.db

      - name: Precompute stats tables (mp_stats + peer_averages)
        if: steps.check.outputs.needs_update == 'true'
        env:
          CHANGED_APIS: ${{ steps.check.outputs.changed_apis }}
        run: |
          python build_precompute.py --output goveye.db --schema schemas/bundled_schema.json --changed-apis "$CHANGED_APIS"

      - name: Build division and bill tags
        if: steps.check.outputs.needs_update == 'true'
        env:
          CHANGED_APIS: ${{ steps.check.outputs.changed_apis }}
        run: |
          python build_tags.py --output goveye.db --schema schemas/bundled_schema.json --changed-apis "$CHANGED_APIS"

      - name: Build MP tags (post-merge, 14-02)
        if: steps.check.outputs.needs_update == 'true' && success()
        run: |
          python build_mp_tags.py --output goveye.db --schema schemas/bundled_schema.json

      - name: Build party leaders (post-merge, 14-02)
        if: steps.check.outputs.needs_update == 'true' && success()
        run: |
          python build_party_leaders.py --output goveye.db --schema schemas/bundled_schema.json

      - name: Build source recommendations (post-merge, 14-02)
        if: steps.check.outputs.needs_update == 'true' && success()
        run: |
          python build_source_recs.py --output goveye.db --schema schemas/bundled_schema.json

      - name: Drop build-time temp tables (D-03 — body text not shipped)
        if: steps.check.outputs.needs_update == 'true'
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('goveye.db')
          conn.execute('DROP TABLE IF EXISTS _publication_bodies')
          conn.commit()
          conn.close()
          print('Dropped _publication_bodies temp table (D-03)')
          "

      - name: Validate merged schema
        if: steps.check.outputs.needs_update == 'true'
        run: |
          python validate_schema.py --db goveye.db --schema schemas/bundled_schema.json

      - name: Generate seed-manifest.json
        if: steps.check.outputs.needs_update == 'true'
        run: |
          python generate_seed_manifest.py --output seed-manifest.json \
            --mps-manifest mps_manifest.json \
            --commons-votes-manifest commons_manifest.json \
            --lords-votes-manifest lords_manifest.json \
            --bills-manifest bills_manifest.json \
            --committees-manifest committees_manifest.json \
            --recess-manifest recess_manifest.json \
            --interests-manifest interests_manifest.json \
            --party-stats-manifest party_stats_manifest.json \
            --bio-data-manifest bio_data_manifest.json \
            --expenses-manifest expenses_manifest.json \
            --mp-links-manifest mp_links_manifest.json \
            --manifestos-manifest manifestos_manifest.json \
            --historical-members-manifest historical_members_manifest.json \
            --debates-manifest debates_manifest.json \
            --member-details-manifest member_details_manifest.json \
            --hansard-manifest hansard_manifest.json \
            --gov-publications-manifest gov_publications_manifest.json \
            --written-statements-manifest written_statements_manifest.json \
            --legislation-manifest legislation_manifest.json

      - name: Publish to GitHub Releases
        if: steps.check.outputs.needs_update == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: seed-latest
          name: Seed Database
          body: |
            Seed database for GovEye — the first-launch download source (D-04).

            - **goveye.db**: Full merged SQLite database (all 16 tables, all 650 MPs
              + 8 former PM placeholders + all historical voting data + bills +
              committees + recess dates + Register of Members' Financial Interests
              including historical data from 2000-2026 via mySociety)
            - **seed-manifest.json**: Per-API dbHash tracking for incremental seed updates

            Built by downloading the per-API DBs from their respective release tags
            and merging them with merge_dbs.py. Only re-merged when a per-API dbHash
            changes (checked every 6 hours).
          files: |
            goveye.db
            seed-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save per-API DBs to cache
        if: steps.check.outputs.needs_update == 'true' && always()
        uses: actions/cache@v4
        with:
          path: per-api-cache
          key: per-api-dbs-${{ hashFiles('mps_manifest.json', 'commons_manifest.json', 'lords_manifest.json', 'bills_manifest.json', 'committees_manifest.json', 'recess_manifest.json', 'interests_manifest.json', 'party_stats_manifest.json', 'bio_data_manifest.json', 'expenses_manifest.json', 'mp_links_manifest.json', 'manifestos_manifest.json', 'historical_members_manifest.json', 'debates_manifest.json', 'member_details_manifest.json', 'hansard_manifest.json', 'gov_publications_manifest.json', 'written_statements_manifest.json', 'legislation_manifest.json') }}

      - name: No changes — skipping merge
        if: steps.check.outputs.needs_update == 'false'
        run: echo "All per-API hashes unchanged since last seed build — no update needed"

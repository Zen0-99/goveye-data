name: Update Expenses

on:
  schedule:
    - cron: '0 8 1 * *'  # Monthly, 1st of month at 8am UTC (IPSA publishes every 2 months)
  workflow_dispatch:      # Manual trigger for seed builds and testing

permissions:
  contents: write  # Required by softprops/action-gh-release@v3

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download mps.db (needed for MP name matching)
        run: |
          gh release download mps-latest --pattern mps.db --output mps.db || echo "No mps.db found"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore seed checkpoint
        id: restore_checkpoint
        if: steps.download_prev.outputs.has_previous != 'true'
        uses: actions/cache@v4
        with:
          path: expenses.db
          key: expenses-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}
          restore-keys: |
            expenses-seed-${{ hashFiles('schemas/bundled_schema.json') }}-

      - name: Download previous DB and manifest
        id: download_prev
        run: |
          gh release download expenses-latest \
            --pattern expenses.db --output prev_expenses.db || echo "No previous DB (first run)"
          gh release download expenses-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
          if [ -f prev_expenses.db ]; then
            echo "has_previous=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Expenses database (seed mode)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python build_ipsa.py --output expenses.db --schema schemas/bundled_schema.json --mode seed --mps-db mps.db --checkpoint-db expenses.db

      - name: Build Expenses database (delta mode)
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python build_ipsa.py --output expenses.db --schema schemas/bundled_schema.json --mode delta --previous-db prev_expenses.db --mps-db mps.db

      - name: Save seed checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && always()
        uses: actions/cache@v4
        with:
          path: expenses.db
          key: expenses-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}

      - name: Generate diff patch
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python diff_db.py --new expenses.db --previous prev_expenses.db --schema schemas/bundled_schema.json --output patch.json --tables expenses

      - name: Generate diff patch (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python diff_db.py --new expenses.db --schema schemas/bundled_schema.json --output patch.json --tables expenses

      - name: Generate manifest
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python manifest.py --db expenses.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python manifest.py --db expenses.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: expenses-latest
          name: Expenses Latest
          body: |
            IPSA expense claims update for GovEye (monthly).

            - **expenses.db**: Per-API SQLite database (expenses table only)
            - **patch.json**: Incremental diff patch (expenses)
            - **manifest.json**: Version, SHA-256 hashes, and file sizes

            See manifest.json for the current version number and file hashes.
          files: |
            expenses.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Update Companies House

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly, Monday 8am UTC (after interests + mps)
  workflow_dispatch:

permissions:
  contents: write  # Required by softprops/action-gh-release@v3

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 650 MPs × officer search + candidate appointments at ~2 req/s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync schema from GovEye
        run: python sync_schema.py

      - name: Download input DBs (mps for matching, interests for cross-match)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download mps-latest --pattern mps.db --output mps.db
          gh release download interests-latest --pattern interests.db --output interests.db \
            || echo "WARN: interests.db not found — interest cross-match disabled"

      - name: Restore seed checkpoint
        id: restore_checkpoint
        if: steps.download_prev.outputs.has_previous != 'true'
        uses: actions/cache@v4
        with:
          path: companies_house.db
          key: companies-house-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}
          restore-keys: |
            companies-house-seed-${{ hashFiles('schemas/bundled_schema.json') }}-

      - name: Download previous DB and manifest
        id: download_prev
        run: |
          gh release download companies-house-latest \
            --pattern companies_house.db --output prev_companies_house.db || echo "No previous DB (first run)"
          gh release download companies-house-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
          if [ -f prev_companies_house.db ]; then
            echo "has_previous=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download failed-run checkpoint (if any)
        if: steps.download_prev.outputs.has_previous != 'true'
        continue-on-error: true
        run: |
          PREV_RUN=$(gh run list --workflow=update-companies-house.yml --status=failure --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" --name companies-house-db-checkpoint --dir . || echo "No checkpoint from failed run"
            if [ -f companies_house.db ]; then
              echo "Found checkpoint from failed run $PREV_RUN — will resume"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Companies House database (seed mode)
        if: steps.download_prev.outputs.has_previous != 'true'
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          python build_companies_house.py --output companies_house.db \
            --schema schemas/bundled_schema.json --mps-db mps.db \
            --interests-db interests.db --mode seed \
            --checkpoint-db companies_house.db

      - name: Build Companies House database (delta mode)
        if: steps.download_prev.outputs.has_previous == 'true'
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          python build_companies_house.py --output companies_house.db \
            --schema schemas/bundled_schema.json --mps-db mps.db \
            --interests-db interests.db --mode delta \
            --previous-db prev_companies_house.db

      - name: Save seed checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && always()
        uses: actions/cache@v4
        with:
          path: companies_house.db
          key: companies-house-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}

      - name: Upload checkpoint artifact (for failed-run resume)
        if: steps.download_prev.outputs.has_previous != 'true' && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: companies-house-db-checkpoint
          path: companies_house.db
          retention-days: 7

      - name: Generate diff patch
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python diff_db.py --new companies_house.db --previous prev_companies_house.db \
            --schema schemas/bundled_schema.json --output patch.json \
            --tables mp_officer_identity,mp_appointments

      - name: Generate diff patch (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python diff_db.py --new companies_house.db --schema schemas/bundled_schema.json \
            --output patch.json --tables mp_officer_identity,mp_appointments

      - name: Generate manifest
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python manifest.py --db companies_house.db --patch patch.json --output manifest.json \
            --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python manifest.py --db companies_house.db --patch patch.json --output manifest.json \
            --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: companies-house-latest
          name: Companies House Latest
          body: |
            Companies House enrichment for GovEye (weekly).

            - **companies_house.db**: Per-API SQLite database
              (mp_officer_identity + mp_appointments tables)
            - **patch.json**: Incremental diff patch
            - **manifest.json**: Version, SHA-256 hashes, and file sizes

            See manifest.json for the current version number and file hashes.
          files: |
            companies_house.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

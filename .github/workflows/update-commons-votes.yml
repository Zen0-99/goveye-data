name: Update Commons Votes

on:
  schedule:
    - cron: '0 */6 * * *'  # 4x daily (every 6 hours per D-09)
  workflow_dispatch:      # Manual trigger for seed builds and testing

permissions:
  contents: write  # Required by softprops/action-gh-release@v3
  actions: write   # Required to trigger update-debates workflow

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Commons divisions with detail fetches

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if parliament is in recess
        id: recess_check
        run: python check_recess.py

      - name: Restore seed checkpoint
        id: restore_checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: commons_votes.db
          key: commons-votes-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}
          restore-keys: |
            commons-votes-seed-${{ hashFiles('schemas/bundled_schema.json') }}-

      - name: Download previous DB and manifest
        id: download_prev
        run: |
          gh release download commons-votes-latest \
            --pattern commons_votes.db --output prev_commons_votes.db || echo "No previous DB (first run)"
          gh release download commons-votes-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
          if [ -f prev_commons_votes.db ]; then
            echo "has_previous=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Commons Votes database (seed mode)
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python build_commons_votes.py --output commons_votes.db --schema schemas/bundled_schema.json --mode seed --checkpoint-db commons_votes.db

      - name: Build Commons Votes database (delta mode)
        if: steps.download_prev.outputs.has_previous == 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python build_commons_votes.py --output commons_votes.db --schema schemas/bundled_schema.json --mode delta --previous-db prev_commons_votes.db

      - name: Save seed checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true' && always()
        uses: actions/cache@v4
        with:
          path: commons_votes.db
          key: commons-votes-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}

      # Per-API DBs are intermediate artifacts, not opened by Room.
      # Schema validation happens on the merged goveye.db in build-seed.yml.
      - name: Generate diff patch
        if: steps.download_prev.outputs.has_previous == 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python diff_db.py --new commons_votes.db --previous prev_commons_votes.db --schema schemas/bundled_schema.json --output patch.json --tables divisions,division_votes

      - name: Generate diff patch (first run)
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python diff_db.py --new commons_votes.db --schema schemas/bundled_schema.json --output patch.json --tables divisions,division_votes

      - name: Generate manifest
        if: steps.download_prev.outputs.has_previous == 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python manifest.py --db commons_votes.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: steps.download_prev.outputs.has_previous != 'true' && steps.recess_check.outputs.skip != 'true'
        run: |
          python manifest.py --db commons_votes.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        if: steps.recess_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: commons-votes-latest
          name: Commons Votes Latest
          body: |
            Commons Votes database update for GovEye (4x daily per D-09).

            - **commons_votes.db**: Per-API SQLite database (Commons divisions + division_votes, house=1 only)
            - **patch.json**: Incremental diff patch (divisions + division_votes)
            - **manifest.json**: Version, SHA-256 hashes, and file sizes
          files: |
            commons_votes.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger debates workflow
        if: steps.recess_check.outputs.skip != 'true'
        run: gh workflow run update-debates.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

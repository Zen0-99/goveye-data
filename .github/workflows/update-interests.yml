name: Update Interests

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly, Monday 6am UTC
  workflow_dispatch:      # Manual trigger for seed builds and testing

permissions:
  contents: write  # Required by softprops/action-gh-release@v3

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Interests fetch is slow — 650 MPs × variable interests per MP

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seed checkpoint
        id: restore_checkpoint
        if: steps.download_prev.outputs.has_previous != 'true'
        uses: actions/cache@v4
        with:
          path: interests.db
          key: interests-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}
          restore-keys: |
            interests-seed-${{ hashFiles('schemas/bundled_schema.json') }}-

      - name: Download previous DB and manifest
        id: download_prev
        run: |
          # Attempt to download previous interests.db and manifest.json from the interests-latest release.
          # If this fails (first run, no previous release), we proceed in seed mode.
          gh release download interests-latest \
            --pattern interests.db --output prev_interests.db || echo "No previous DB (first run)"
          gh release download interests-latest \
            --pattern manifest.json --output prev_manifest.json || echo "No previous manifest (first run)"
          if [ -f prev_interests.db ]; then
            echo "has_previous=true" >> $GITHUB_OUTPUT
          else
            echo "has_previous=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download failed-run checkpoint (if any)
        if: steps.download_prev.outputs.has_previous != 'true'
        continue-on-error: true
        run: |
          PREV_RUN=$(gh run list --workflow=update-interests.yml --status=failure --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" --name interests-db-checkpoint --dir . || echo "No checkpoint from failed run"
            if [ -f interests.db ]; then
              echo "Found checkpoint from failed run $PREV_RUN � will resume"
            fi
          fi
        env:
          GH_TOKEN: ${ "{" }secrets.GITHUB_TOKEN{ "}" }
      - name: Build Interests database (seed mode)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python build_interests.py --output interests.db --schema schemas/bundled_schema.json --mode seed --checkpoint-db interests.db

      - name: Build Interests database (delta mode)
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python build_interests.py --output interests.db --schema schemas/bundled_schema.json --mode delta --previous-db prev_interests.db

      - name: Save seed checkpoint
        if: steps.download_prev.outputs.has_previous != 'true' && always()
        uses: actions/cache@v4
        with:
          path: interests.db
          key: interests-seed-${{ hashFiles('schemas/bundled_schema.json') }}-${{ github.run_id }}

      - name: Upload checkpoint artifact (for failed-run resume)
        if: steps.download_prev.outputs.has_previous != 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: interests-db-checkpoint
          path: interests.db
          retention-days: 7

      # --- Historical interests from mySociety (2000-2026) ---
      # Downloads the mySociety all_time_register CSV (cached) and builds
      # a historical interests DB for 626 current MPs + 8 former PMs.
      # The CSV is cached to avoid re-downloading the 48MB file every run.

      - name: Download mps.db for name matching
        run: |
          gh release download mps-latest --pattern mps.db --output mps.db || echo "WARN: mps.db not found"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore mySociety CSV cache
        id: restore_csv_cache
        uses: actions/cache@v4
        with:
          path: all_time_register.csv
          key: mysociety-csv-${{ github.run_id }}
          restore-keys: |
            mysociety-csv-

      - name: Build historical interests
        run: |
          python build_historical_interests.py \
            --output interests_historical.db \
            --goveye-db mps.db \
            --csv all_time_register.csv

      - name: Merge live + historical interests
        run: |
          python merge_interests.py \
            --live interests.db \
            --historical interests_historical.db \
            --output interests_merged.db

      - name: Save mySociety CSV cache
        if: always()
        uses: actions/cache@v4
        with:
          path: all_time_register.csv
          key: mysociety-csv-${{ github.run_id }}

      # Use the merged DB as the final interests.db for publishing
      - name: Replace interests.db with merged version
        run: |
          cp interests_merged.db interests.db

      # Per-API DBs are intermediate artifacts, not opened by Room.
      # Schema validation happens on the merged goveye.db in build-seed.yml.
      - name: Generate diff patch
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python diff_db.py --new interests.db --previous prev_interests.db --schema schemas/bundled_schema.json --output patch.json --tables interests

      - name: Generate diff patch (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python diff_db.py --new interests.db --schema schemas/bundled_schema.json --output patch.json --tables interests

      - name: Generate manifest
        if: steps.download_prev.outputs.has_previous == 'true'
        run: |
          python manifest.py --db interests.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json --previous-manifest prev_manifest.json

      - name: Generate manifest (first run)
        if: steps.download_prev.outputs.has_previous != 'true'
        run: |
          python manifest.py --db interests.db --patch patch.json --output manifest.json --schema schemas/bundled_schema.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: interests-latest
          name: Interests Latest
          body: |
            Interests database update for GovEye (weekly).

            - **interests.db**: Per-API SQLite database (interests table only)
              — now includes historical data (2000-2026) from mySociety
              for 626 current MPs + 8 former PMs, merged with live Parliament
              API data
            - **patch.json**: Incremental diff patch (interests)
            - **manifest.json**: Version, SHA-256 hashes, and file sizes

            See manifest.json for the current version number and file hashes.
          files: |
            interests.db
            patch.json
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
